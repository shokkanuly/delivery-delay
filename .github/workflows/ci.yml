name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q
        env:
          PYTHONPATH: .

      - name: Verify the ML-correctness demo still runs
        run: python run.py
        env:
          PYTHONPATH: .

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate compose config
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --env-file .env.customer.example -f docker-compose.customer.yml config -q
      - name: Build the image
        run: docker build -t delivery-delay:ci .
      - name: Rehearse customer containers, TLS, persistence and recovery
        run: |
          pip install httpx
          python -m scripts.verify_customer_stack --image delivery-delay:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-stack-evidence
          path: test-results/receiving/customer-stack.json

  receiving-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Install locked receiving-only server runtime
        run: |
          pip install uv==0.13.6
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/receiving-runtime" uv sync --locked --no-install-project
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python -m scripts.verify_receiving_browser --browser ${{ matrix.browser }} --app vercel_app:app --server-python "$RUNNER_TEMP/receiving-runtime/bin/python"
        env:
          OMP_NUM_THREADS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receiving-browser-evidence-${{ matrix.browser }}
          path: test-results/receiving/

  receiving-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sitepulse_test
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: sitepulse_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sitepulse_test -d sitepulse_tests"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      OMP_NUM_THREADS: "1"
      SITEPULSE_TEST_RECEIVING_POSTGRES_URL: postgresql+psycopg://sitepulse_test:ci-only-test-password@localhost:5432/sitepulse_tests
      SITEPULSE_TEST_POSTGRES_URL: postgresql+psycopg://sitepulse_test:ci-only-test-password@localhost:5432/sitepulse_migrations
      SITEPULSE_TEST_RESTORE_URL: postgresql+psycopg://sitepulse_test:ci-only-test-password@localhost:5432/sitepulse_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install backup clients and create empty rehearsal targets
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://sitepulse_test:ci-only-test-password@localhost:5432/sitepulse_tests', autocommit=True) as conn:
              conn.execute('CREATE DATABASE sitepulse_migrations')
              conn.execute('CREATE DATABASE sitepulse_restore')
          PY
      - run: python -m pytest tests/test_receiving.py tests/test_receiving_operations.py tests/test_receiving_hosting.py -q
