# Vercel installs this smaller receiving runtime. The full audit/ML/analyst
# environment continues to use requirements.txt and its existing commands.
[project]
name = "sitepulse-receiving"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.1",
  "pandas>=2.0",
]

[tool.vercel]
entrypoint = "vercel_app:app"

[tool.vercel.fastapi.static]
# Keep customer-route guards on every static request.
cdn = false
